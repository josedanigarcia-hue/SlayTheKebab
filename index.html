<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Slay the Kebab - Papadas Games</title>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --bg-panel: #131822;
      --bg-terminal: #080a0f;
      --border-color: #2a3446;
      --c-heroe: #4ade80;
      --c-enemigo: #f87171;
      --c-boss: #e879f9;
      --c-skill: #22d3ee;
      --c-item: #facc15;
      --c-artifact: #60a5fa;
      --c-sistema: #9ca3af;
      --c-texto: #f3f4f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--c-texto);
      font-family: 'Consolas', 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .app-container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 20px);
      background: var(--bg-panel);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    /* Barra superior */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 14px;
      background: #1a2130;
      border-bottom: 1px solid var(--border-color);
      flex-wrap: wrap;
      gap: 8px;
    }

    .brand {
      font-weight: bold;
      color: var(--c-boss);
      letter-spacing: 1px;
      font-size: 0.95rem;
    }

    .top-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-small {
      background: #252f42;
      color: var(--c-texto);
      border: 1px solid #3b4963;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      transition: background 0.15s;
    }

    .btn-small:hover {
      background: #32405a;
    }

    /* HUD de Estadísticas */
    .hud-bar {
      display: none;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 8px;
      padding: 8px 14px;
      background: #10141d;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.85rem;
    }

    .hud-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .bar-bg {
      width: 100%;
      height: 8px;
      background: #262c3a;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill-hp {
      height: 100%;
      background: var(--c-heroe);
      transition: width 0.25s ease;
    }

    .bar-fill-sp {
      height: 100%;
      background: var(--c-artifact);
      transition: width 0.25s ease;
    }

    /* Modal/Banner de Portada */
    #cover-container {
      display: none;
      text-align: center;
      background: #05070a;
      padding: 10px;
      border-bottom: 1px solid var(--border-color);
      max-height: 260px;
      overflow: hidden;
    }

    #cover-container img {
      max-height: 240px;
      max-width: 100%;
      object-fit: contain;
      border-radius: 6px;
    }

    /* Pantalla de Terminal */
    #terminal {
      flex: 1;
      background: var(--bg-terminal);
      padding: 16px;
      overflow-y: auto;
      line-height: 1.5;
      font-size: 0.96rem;
      white-space: pre-wrap;
      word-break: break-word;
      cursor: pointer;
    }

    .ascii-art {
      font-family: 'Consolas', 'Courier New', monospace;
      line-height: 1.15;
      font-size: clamp(0.45rem, 1.5vw, 0.85rem);
      overflow-x: auto;
      margin: 8px 0;
      font-weight: bold;
    }

    .line {
      margin-bottom: 4px;
    }

    /* Colores de ui.py */
    .c-heroe { color: var(--c-heroe); font-weight: bold; }
    .c-enemigo { color: var(--c-enemigo); font-weight: bold; }
    .c-boss { color: var(--c-boss); font-weight: bold; }
    .c-skill { color: var(--c-skill); }
    .c-item { color: var(--c-item); }
    .c-artifact { color: var(--c-artifact); }
    .c-sistema { color: var(--c-sistema); }

    /* Panel de Botones de Acción */
    #controls {
      padding: 12px 14px;
      background: #151b26;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 64px;
      align-items: center;
      justify-content: center;
    }

    .action-btn {
      background: #1f293d;
      color: var(--c-texto);
      border: 1px solid #3b4d71;
      padding: 10px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.15s ease;
      flex: 1 1 calc(50% - 8px);
      max-width: 440px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .action-btn:hover {
      background: #2c3b59;
      border-color: var(--c-artifact);
      transform: translateY(-1px);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    .action-btn .key-badge {
      background: #0e131d;
      color: var(--c-item);
      border: 1px solid #33415c;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .action-btn.btn-secret {
      flex: 0 1 auto;
      background: #181e2c;
      border-style: dashed;
      font-size: 0.82rem;
      color: var(--c-sistema);
    }

    .hint-skip {
      font-size: 0.75rem;
      color: var(--c-sistema);
    }

    @media (max-width: 600px) {
      .action-btn {
        flex: 1 1 100%;
        max-width: 100%;
      }
      #terminal {
        font-size: 0.88rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Barra superior -->
  <div class="top-bar">
    <div class="brand">🥙 SLAY THE KEBAB</div>
    <div class="top-controls">
      <span class="hint-skip" title="Haz clic en la consola o pulsa Espacio/Enter para acelerar el texto">⚡ Clic/Tecla = Saltar texto</span>
      <button class="btn-small" id="btn-speed" onclick="toggleSpeed()">Velocidad: Normal</button>
      <button class="btn-small" id="btn-cover" onclick="toggleCover()">🖼️ Portada</button>
      <button class="btn-small" onclick="clearTerminal()">🧹 Limpiar log</button>
    </div>
  </div>

  <!-- Imagen de Portada (se muestra si Portada.png está en la carpeta) -->
  <div id="cover-container">
    <img src="Portada.png" alt="Portada Slay the Kebab" onerror="document.getElementById('btn-cover').style.display='none'; this.parentElement.style.display='none';" />
  </div>

  <!-- HUD en tiempo real -->
  <div class="hud-bar" id="hud">
    <div class="hud-item">
      <div><span id="hud-name" class="c-heroe">-</span> (Nv. <span id="hud-lvl" class="c-boss">1</span>)</div>
      <div class="c-sistema">Cap. <span id="hud-chap">1</span> | Nodo: <span id="hud-node">n0</span></div>
    </div>
    <div class="hud-item">
      <div>HP: <span id="hud-hp" class="c-artifact">0/0</span></div>
      <div class="bar-bg"><div id="bar-hp" class="bar-fill-hp" style="width:100%"></div></div>
    </div>
    <div class="hud-item">
      <div>SP: <span id="hud-sp" class="c-artifact">0/0</span></div>
      <div class="bar-bg"><div id="bar-sp" class="bar-fill-sp" style="width:100%"></div></div>
    </div>
    <div class="hud-item">
      <div>⚔️ ATQ: <span id="hud-atk" class="c-heroe">0</span> | 🛡️ DEF: <span id="hud-def" class="c-heroe">0</span></div>
      <div>✨ EXP: <span id="hud-exp" class="c-skill">0</span> | 💰 ORO: <span id="hud-gold" class="c-item">0</span></div>
    </div>
  </div>

  <!-- Consola de texto -->
  <div id="terminal" onclick="skipTypewriter()"></div>

  <!-- Botones de acción -->
  <div id="controls"></div>
</div>

<script>
/* =========================================================
   1. SISTEMA DE UI, COLORES Y MÁQUINA DE ESCRIBIR (ui.py)
   ========================================================= */
const C_HEROE = "\x1b[HEROE]";
const C_ENEMIGO = "\x1b[ENEMIGO]";
const C_BOSS = "\x1b[BOSS]";
const C_SKILL = "\x1b[SKILL]";
const C_ITEM = "\x1b[ITEM]";
const C_ARTIFACT = "\x1b[ARTIFACT]";
const C_SISTEMA = "\x1b[SISTEMA]";
const RESET = "\x1b[RESET]";

const COLOR_CLASS_MAP = {
  "\x1b[HEROE]": "c-heroe",
  "\x1b[ENEMIGO]": "c-enemigo",
  "\x1b[BOSS]": "c-boss",
  "\x1b[SKILL]": "c-skill",
  "\x1b[ITEM]": "c-item",
  "\x1b[ARTIFACT]": "c-artifact",
  "\x1b[SISTEMA]": "c-sistema"
};

const ASCII_BANNERS = {
  "PAPADAS GAMES": `
______  ___  ______  ___  ______   ___   _____   _____   ___  ___  ___ _____ _____ 
| ___ \\/ _ \\ | ___ \\/ _ \\ |  _  \\ / _ \\ /  ___| |  __ \\ / _ \\ |  \\/  ||  ___/  ___|
| |_/ / /_\\ \\| |_/ / /_\\ \\| | | |/ /_\\ \\\\ \`--.  | |  \\// /_\\ \\| .  . || |__ \\ \`--. 
|  __/|  _  ||  __/|  _  || | | ||  _  | \`--. \\ | | __ |  _  || |\\/| ||  __| \`--. \\
| |   | | | || |   | | | || |/ / | | | |/\\__/ / | |_\\ \\| | | || |  | || |___/\\__/ /
\\_|   \\_| |_/\\_|   \\_| |_/|___/  \\_| |_/\\____/   \\____/\\_| |_/\\_|  |_/\\____/\\____/ `,
  "Slay the Kebab": `
 _____ _               _   _            _   __     _           _     
/  ___| |             | | | |          | | / /    | |         | |    
\\ \`--.| | __ _ _   _  | |_| |__   ___  | |/ /  ___| |__   __ _| |__  
 \`--. \\ |/ _\` | | | | | __| '_ \\ / _ \\ |    \\ / _ \\ '_ \\ / _\` | '_ \\ 
/\\__/ / | (_| | |_| | | |_| | | |  __/ | |\\  \\  __/ |_) | (_| | |_) |
\\____/|_|\\__,_|\\__, |  \\__|_| |_|\\___| \\_| \\_/\\___|_.__/ \\__,_|_.__/ 
                __/ |                                                
               |___/                                                 `,
  "EPILOGO": `
   __________  ______   ____  __________ 
  / ____/ __ \\/  _/ /  / __ \\/ ____/ __ \\
 / __/ / /_/ // // /  / / / / / __/ / / /
/ /___/ ____// // /__/ /_/ / /_/ / /_/ / 
/_____/_/   /___/_____\\____/\\____/\\____/  `,
  "Slay The Kebab": `
   _____ __               ________          __ __     __          __  
  / ___// /___ ___  __   /_  __/ /_  ___   / //_/__  / /_  ____ _/ /_ 
  \\__ \\/ / __ \`/ / / /    / / / __ \\/ _ \\ / ,< / _ \\/ __ \\/ __ \`/ __ \\
 ___/ / / /_/ / /_/ /    / / / / / /  __// /| /  __/ /_/ / /_/ / /_/ /
/____/_/\\__,_/\\__, /    /_/ /_/ /_/\\___//_/ |_\\___/_.___/\\__,_/_.___/ 
             /____/                                                   `
};

const terminalEl = document.getElementById("terminal");
const controlsEl = document.getElementById("controls");

let speedMultiplier = 1; // 1 = Normal, 0.25 = Rápido, 0 = Instantáneo
let skipCurrentLine = false;
let isTyping = false;
let activeInputResolver = null;
let currentButtonMap = {};

function toggleSpeed() {
  const btn = document.getElementById("btn-speed");
  if (speedMultiplier === 1) {
    speedMultiplier = 0.25;
    btn.textContent = "Velocidad: Rápida";
  } else if (speedMultiplier === 0.25) {
    speedMultiplier = 0;
    btn.textContent = "Velocidad: Instantánea";
  } else {
    speedMultiplier = 1;
    btn.textContent = "Velocidad: Normal";
  }
}

function toggleCover() {
  const el = document.getElementById("cover-container");
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function clearTerminal() {
  terminalEl.innerHTML = "";
}

function skipTypewriter() {
  if (isTyping) {
    skipCurrentLine = true;
  }
}

window.addEventListener("keydown", (e) => {
  if (isTyping) {
    skipCurrentLine = true;
    return;
  }
  if (activeInputResolver && currentButtonMap[e.key] !== undefined) {
    e.preventDefault();
    const val = currentButtonMap[e.key];
    resolveChoice(val);
  }
});

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function imprimir_texto(texto, velocidad = 0.02) {
  if (texto === null || texto === undefined) return;
  const str = String(texto);
  const lineDiv = document.createElement("div");
  lineDiv.className = "line";
  terminalEl.appendChild(lineDiv);

  const regex = /(\x1b\[[A-Z]+\])/g;
  const partes = str.split(regex);

  let currentSpan = document.createElement("span");
  lineDiv.appendChild(currentSpan);

  isTyping = true;
  skipCurrentLine = false;

  for (const parte of partes) {
    if (!parte) continue;
    if (parte.startsWith("\x1b[")) {
      if (parte === RESET) {
        currentSpan = document.createElement("span");
        lineDiv.appendChild(currentSpan);
      } else {
        const cls = COLOR_CLASS_MAP[parte];
        currentSpan = document.createElement("span");
        if (cls) currentSpan.className = cls;
        lineDiv.appendChild(currentSpan);
      }
    } else {
      const delayMs = velocidad * 1000 * speedMultiplier;
      if (delayMs <= 0 || skipCurrentLine) {
        currentSpan.textContent += parte;
      } else {
        for (const letra of parte) {
          currentSpan.textContent += letra;
          terminalEl.scrollTop = terminalEl.scrollHeight;
          if (!skipCurrentLine) {
            await sleep(delayMs);
          }
        }
      }
    }
  }

  isTyping = false;
  terminalEl.scrollTop = terminalEl.scrollHeight;
}

function mostrar_titulo_gigante(texto, colorCode = C_SISTEMA) {
  const pre = document.createElement("pre");
  const cls = COLOR_CLASS_MAP[colorCode] || "";
  pre.className = `ascii-art ${cls}`;
  pre.textContent = ASCII_BANNERS[texto] || `=== ${texto} ===`;
  terminalEl.appendChild(pre);
  terminalEl.scrollTop = terminalEl.scrollHeight;
}

function printDivider() {
  const div = document.createElement("div");
  div.className = "line c-sistema";
  div.textContent = "=".repeat(60);
  terminalEl.appendChild(div);
  terminalEl.scrollTop = terminalEl.scrollHeight;
}

function stripTags(str) {
  return String(str).replace(/\x1b\[[A-Z]+\]/g, "");
}

function resolveChoice(value) {
  if (!activeInputResolver) return;
  const resolver = activeInputResolver;
  activeInputResolver = null;
  currentButtonMap = {};
  controlsEl.innerHTML = "";
  resolver(String(value));
}

function askOptions(options, allowSecretCode = false) {
  updateHUD();
  return new Promise((resolve) => {
    activeInputResolver = resolve;
    controlsEl.innerHTML = "";
    currentButtonMap = {};

    options.forEach((opt) => {
      const btn = document.createElement("button");
      btn.className = "action-btn";
      if (opt.key !== undefined) {
        currentButtonMap[String(opt.key)] = opt.value;
        const badge = document.createElement("span");
        badge.className = "key-badge";
        badge.textContent = opt.key;
        btn.appendChild(badge);
      }
      const labelSpan = document.createElement("span");
      labelSpan.textContent = stripTags(opt.label);
      btn.appendChild(labelSpan);
      btn.onclick = () => resolveChoice(opt.value);
      controlsEl.appendChild(btn);
    });

    if (allowSecretCode) {
      const secretBtn = document.createElement("button");
      secretBtn.className = "action-btn btn-secret";
      secretBtn.innerHTML = `<span class="key-badge">🔑</span><span>Código Secreto</span>`;
      secretBtn.onclick = () => {
        const code = prompt("Ingresa el código secreto:");
        if (code !== null && code.trim() !== "") {
          resolveChoice(code.trim());
        }
      };
      controlsEl.appendChild(secretBtn);
    }
  });
}

/* =========================================================
   2. UTILIDADES ALEATORIAS E INVENTARIO (inventory_utils.py)
   ========================================================= */
function randint(min, max) {
  const a = Math.trunc(min);
  const b = Math.max(a, Math.trunc(max));
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

function choice(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function weightedChoice(items, weights) {
  const total = weights.reduce((acc, w) => acc + w, 0);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    if (r < weights[i]) return items[i];
    r -= weights[i];
  }
  return items[items.length - 1];
}

function sample(arr, k) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy.slice(0, Math.min(k, copy.length));
}

function summarize_inventory(items) {
  const counts = new Map();
  for (const item of items) {
    counts.set(item.name, (counts.get(item.name) || 0) + 1);
  }
  return Array.from(counts.entries());
}

function get_item_by_display_index(items, choiceIdx) {
  const grouped = summarize_inventory(items);
  if (choiceIdx < 1 || choiceIdx > grouped.length) return null;
  const selectedName = grouped[choiceIdx - 1][0];
  return items.find(it => it.name === selectedName) || null;
}

/* =========================================================
   3. HABILIDADES (skills.py)
   ========================================================= */
class Skill {
  constructor({
    name, sp_cost, cooldown, level_required,
    is_passive = false, passive_once = false, used_once = false,
    hp_threshold = 1.0, priority = 0, requires_buff = null
  }) {
    this.name = name;
    this.sp_cost = sp_cost;
    this.cooldown = cooldown;
    this.level_required = level_required;
    this.is_passive = is_passive;
    this.passive_once = passive_once;
    this.passive_triggered = false;
    this.last_used = -cooldown;
    this.used_once = used_once;
    this.skill_triggered = false;
    this.hp_threshold = hp_threshold;
    this.priority = priority;
    this.requires_buff = requires_buff;
  }

  can_use(character, current_turn) {
    const sp_ok = character.sp >= this.sp_cost;
    const level_ok = character.level >= this.level_required;
    const cooldown_ok = (current_turn - this.last_used) >= this.cooldown;
    return sp_ok && level_ok && cooldown_ok;
  }

  get_status_label(current_turn, character) {
    if (!this.can_use(character, current_turn)) {
      const turns_left = this.cooldown - (current_turn - this.last_used);
      if (turns_left <= 0 && character.sp < this.sp_cost) {
        return `${C_ENEMIGO}Falta SP${RESET}`;
      }
      if (turns_left <= 1) {
        return "1 turno restante";
      }
      return `${C_ENEMIGO}${turns_left} turnos restantes${RESET}`;
    }
    return "Disponible";
  }

  passive_effect(user, target) {
    return null;
  }
}

class DisparoDeBalin extends Skill {
  constructor() { super({ name: "Disparo de Balín", sp_cost: 20, cooldown: 3, level_required: 1 }); }
  effect(user, target) {
    const damage = Math.max(0, Math.trunc(user.attack * 2.5 - target.defense));
    target.take_damage(damage);
    return `¡${C_HEROE}${user.name}${RESET} dispara un balín a ${C_ENEMIGO}${target.name}${RESET} y hace ${C_ARTIFACT}${damage}${RESET} de daño!`;
  }
}

class GiroHipnotico extends Skill {
  constructor() { super({ name: "Giro Hipnótico", sp_cost: 40, cooldown: 5, level_required: 5 }); }
  effect(user, target) {
    const damage = Math.max(0, Math.trunc(target.attack * 3 - target.defense));
    target.take_damage(damage);
    target.lose_turn = true;
    return `¡${C_HEROE}${user.name}${RESET} realiza un giro hipnótico con un final remangandose y ${C_ENEMIGO}${target.name}${RESET} intenta imitarlo pero sufre ${C_ARTIFACT}${damage}${RESET} de daño y pierde el turno!\n${C_ENEMIGO}${target.name}${RESET}: '¡Haces que parezca facil!'`;
  }
}

class OllaExplosiva extends Skill {
  constructor() { super({ name: "Olla Explosiva", sp_cost: 50, cooldown: 4, level_required: 10 }); }
  effect(user, target) {
    const damage = Math.max(0, randint(Math.trunc(user.attack * 6), Math.trunc(user.attack * 8) - target.defense));
    target.take_damage(damage);
    const frase = choice(['¡Ha sido una explosion incendiaria!', '¿Estaba llena de cerveza?', '¿Eso son garbanzos? Joder, que hambre']);
    return `¡${C_HEROE}${user.name}${RESET} lanza una olla explosiva a ${C_ENEMIGO}${target.name}${RESET} y hace ${C_ARTIFACT}${damage}${RESET} de daño!\n${frase}`;
  }
}

class VozConfusa extends Skill {
  constructor() { super({ name: "Voz Confusa", sp_cost: 0, cooldown: 0, level_required: 1, is_passive: true }); }
  passive_effect(user, target) {
    if (weightedChoice([true, false], [30, 70])) {
      target.lose_turn = true;
      target.defense = Math.trunc(target.defense * 0.5);
      return `${C_SKILL}¡Voz Confusa!${RESET} ${C_ENEMIGO}${target.name}${RESET} pierde el turno y su defensa es reducida a la mitad.\n${C_ENEMIGO}${target.name}${RESET}: '¿No decias que solo habria hombres?'`;
    }
    return null;
  }
}

class RecitalMarxista extends Skill {
  constructor() { super({ name: "Recital Marxista", sp_cost: 30, cooldown: 4, level_required: 4 }); }
  effect(user, target) {
    const damage = randint(Math.trunc(user.attack * 3.5), Math.trunc(user.attack * 5));
    target.take_damage(damage);
    return `¡${C_HEROE}${user.name}${RESET} recita parrafo a parrafo en ruso el manifiesto comunista blandiendo una hoz y martillo contra ${C_ENEMIGO}${target.name}${RESET} y provoca ${C_ARTIFACT}${damage}${RESET} de daño!`;
  }

function grant_random_reward(player) {
  const reward_items = get_all_items();
  const ownedNames = new Set(player.artifacts.map(a => a.name));
  const reward_artifacts = get_all_artifacts().filter(Cls => !ownedNames.has(new Cls().name));
  if (Math.random() < 0.75 || reward_artifacts.length === 0) {
    const RCls = choice(reward_items);
    const reward = new RCls();
    player.add_item(reward);
    return `${C_HEROE}${player.name}${RESET} recibe un premio: ${C_ITEM}${reward.name}${RESET}`;
  }
  const ACls = choice(reward_artifacts);
  return player.add_artifact(new ACls());
}

   5. PERSONAJES Y ENEMIGOS (character.py, enemy.py, data.py)
   ========================================================= */
class Character {
  constructor(name, char_class, hp, hp_max, sp, sp_max, attack, defense, level, experience) {
    this.name = name;
    this.char_class = char_class;
    this.hp = hp;
    this.hp_max = hp_max;
    this.sp = sp;
    this.sp_max = sp_max;
    this.attack = attack;
    this.defense = defense;
    this.level = level;
    this.experience = experience;
    this.inventory = [];
    this.artifacts = [];
    this.skills = [];
    this.lose_turn = false;
    this.chapter = 1;
    this.current_node_id = "n0";
    this.gold = 0;
    this.active_buffs = new Set();
    this.experience_multiplier = 1;
    this.gold_multiplier = 1;
    this.avoid_damage = false;
    this.is_boss = false;
    this.pending_messages = [];
  }

  is_alive() {
    return this.hp > 0;
  }

  take_damage(amount) {
    if (this.avoid_damage) {
      this.avoid_damage = false;
      const msg = `${C_HEROE}${this.name}${RESET} evita el daño de este turno.`;
      this.pending_messages.push(msg);
      return msg;
    }

    this.hp -= amount;
    if (this.hp < 0) this.hp = 0;

    if (this.hp <= 0) {
      for (const artifact of this.artifacts) {
        if (artifact.revives_on_death && !artifact.used) {
          artifact.used = true;
          this.hp = this.hp_max;
          this.sp = this.sp_max;
          this.lose_turn = false;
          const msg = `El ${C_ARTIFACT}${artifact.name}${RESET} que había en el bolsillo de ${C_HEROE}${this.name}${RESET} se ilumina y entra en su boca.\n${C_HEROE}${this.name}${RESET} ha sido resucitado por ${C_ARTIFACT}${artifact.name}${RESET}.`;
          this.pending_messages.push(msg);
          return msg;
        }
      }
    }
    return null;
  }

  heal(amount) {
    this.hp = Math.min(this.hp + amount, this.hp_max);
  }

  get_status() {
    return `${C_HEROE}${this.name}${RESET} - HP: ${C_ARTIFACT}${this.hp}${RESET}/${C_HEROE}${this.hp_max}${RESET}, SP: ${C_ARTIFACT}${this.sp}${RESET}/${C_HEROE}${this.sp_max}${RESET}, level: ${C_BOSS}${this.level}${RESET}`;
  }

  get_stats() {
    return `${C_HEROE}${this.name}${RESET} - HP: ${C_ARTIFACT}${this.hp}${RESET}/${C_HEROE}${this.hp_max}${RESET}, SP: ${C_ARTIFACT}${this.sp}${RESET}/${C_HEROE}${this.sp_max}${RESET}, level: ${C_BOSS}${this.level}${RESET}\nAttack: ${C_HEROE}${this.attack}${RESET}, Defense: ${C_HEROE}${this.defense}${RESET}, Experience: ${C_SKILL}${this.experience}${RESET}, Gold: ${C_ITEM}${this.gold}${RESET}, Chapter: ${C_BOSS}${this.chapter}${RESET}`;
  }

  get_available_skills() {
    return this.skills.filter(s => s.level_required <= this.level && !s.is_passive);
  }

  check_level_up() {
    const messages = [];
    while (this.experience >= this.level * 100) {
      this.experience -= this.level * 100;
      this.level += 1;
      if (this.on_level_up) this.on_level_up();
      messages.push(`¡${C_HEROE}${this.name}${RESET} ha subido al nivel ${C_SKILL}${this.level}${RESET}!`);
      const newSkills = this.skills.filter(s => s.level_required === this.level);
      for (const sk of newSkills) {
        messages.push(`¡${C_HEROE}${this.name}${RESET} ha aprendido ${C_SKILL}${sk.name}${RESET}!`);
      }
    }
    return messages.length > 0 ? messages : null;
  }

  add_item(item) {
    this.inventory.push(item);
    return `¡${C_HEROE}${this.name}${RESET} ha obtenido ${C_ITEM}${item.name}${RESET}!`;
  }

  add_artifact(artifact) {
    for (const a of this.artifacts) {
      if (a.constructor === artifact.constructor || a.name === artifact.name) {
        const price = artifact.price || 0;
        if (price) {
          const compensation = Math.trunc(price / 2);
          this.gold += compensation;
          return `${C_HEROE}${this.name}${RESET} ya posee el artefacto ${C_ARTIFACT}${artifact.name}${RESET}. Recibe ${C_ITEM}${compensation}${RESET} de oro en compensación.`;
        }
        return `${C_HEROE}${this.name}${RESET} ya posee el artefacto ${C_ARTIFACT}${artifact.name}${RESET}, no puede adquirirlo de nuevo.`;
      }
    }
    this.artifacts.push(artifact);
    let mensaje_final = `${C_HEROE}${this.name}${RESET} ha obtenido el artefacto ${C_ARTIFACT}${artifact.name}${RESET}: ${C_BOSS}${artifact.description}${RESET}.`;
    if (artifact.active_once) {
      const mensaje_efecto = artifact.apply_passive(this, null);
      if (mensaje_efecto) {
        mensaje_final += `\n🌟 ${mensaje_efecto}`;
      }
    }
    return mensaje_final;
  }
}

   ========================================================= */
async function flushPendingMessages(char) {
  while (char.pending_messages && char.pending_messages.length > 0) {
    const msg = char.pending_messages.shift();
    await imprimir_texto(msg);
  }
}

async function combat(player, enemy) {
  await imprimir_texto(`¡Un ${C_ENEMIGO}${enemy.name}${RESET} aparece!`);
  let turn = 0;
  const original_attack = player.attack;
  const original_defense = player.defense;
  const original_hp_max = player.hp_max;
  const original_sp_max = player.sp_max;
  const enemy_original_defense = enemy.defense;

  for (const skill of player.skills) {
    skill.passive_triggered = false;
  }

  for (const artifact of player.artifacts) {
    if (!enemy.is_alive()) break;
    if (artifact.active_once) continue;
    if (artifact.trigger_mode === "combat_start") {
      artifact.triggered = false;
      const message = artifact.on_combat_start(player, enemy);
      if (message) await imprimir_texto(message);
    }
  }

  while (player.is_alive() && enemy.is_alive()) {
    turn += 1;
    enemy.defense = enemy_original_defense;

    for (const artifact of player.artifacts) {
      if (artifact.active_once) continue;
      if (artifact.trigger_mode === "turn_start") {
        const message = artifact.apply_passive(player, enemy);
        if (message) await imprimir_texto(message);
      }
    }

    await imprimir_texto(`\nTurno ${turn}`);
    await imprimir_texto(player.get_status());
    await imprimir_texto(enemy.get_status());
    updateHUD();

    let fled = false;

    for (const artifact of player.artifacts) {
      if (artifact.active_once) continue;
      if (artifact.trigger_mode !== "passive") continue;
      const message = artifact.apply_passive(player, enemy);
      if (message) await imprimir_texto(message);
    }

    for (const skill of player.skills) {
      if (!skill.is_passive) continue;
      if (skill.passive_once && skill.passive_triggered) continue;
      const message = skill.passive_effect(player, enemy);
      if (message) await imprimir_texto(message);
      skill.passive_triggered = true;
    }

    if (player.lose_turn) {
      await imprimir_texto(`${C_HEROE}${player.name} no puede actuar.${RESET}`);
      player.lose_turn = false;
    } else {
      while (true) {
        const action = await askOptions([
          { key: "1", label: "Atacar", value: "1" },
          { key: "2", label: "Usar una habilidad", value: "2" },
          { key: "3", label: "Usar objeto", value: "3" },
          { key: "4", label: "Huir", value: "4" }
        ]);

        if (action === "1") {
          const damage = Math.max(0, player.attack - enemy.defense);
          enemy.take_damage(damage);
          await imprimir_texto(`${C_HEROE}${player.name}${RESET} ataca a ${C_ENEMIGO}${enemy.name}${RESET} y causa ${C_ENEMIGO}${damage}${RESET} de daño.`);

          for (const artifact of player.artifacts) {
            if (artifact.active_once || artifact.trigger_mode !== "attack") continue;
            const message = artifact.apply_passive(player, enemy);
            if (message) await imprimir_texto(message);
          }
          break;
        } else if (action === "2") {
          const available_skills = player.get_available_skills();
          if (available_skills.length === 0) {
            await imprimir_texto("No tienes ninguna habilidad activa disponible todavía.");
            continue;
          }

          await imprimir_texto("0. Volver");
          const skillOpts = [{ key: "0", label: "Volver", value: "0" }];
          for (let i = 0; i < available_skills.length; i++) {
            const sk = available_skills[i];
            const status = sk.get_status_label(turn, player);
            await imprimir_texto(`${C_SKILL}${i + 1}. ${sk.name} (SP: ${sk.sp_cost}) - ${status}${RESET}`);
            skillOpts.push({
              key: String(i + 1),
              label: `${sk.name} (SP: ${sk.sp_cost}) - ${stripTags(status)}`,
              value: String(i + 1)
            });
          }

          const sChoice = parseInt(await askOptions(skillOpts), 10) - 1;
          if (sChoice === -1) continue;

          const skill = available_skills[sChoice];
          if (player.sp < skill.sp_cost) {
            await imprimir_texto(`${C_ENEMIGO}No tienes suficiente SP.${RESET}`);
          } else if (turn - skill.last_used < skill.cooldown) {
            const turns_left = skill.cooldown - (turn - skill.last_used);
            await imprimir_texto(`${C_SKILL}${skill.name}${RESET} no está lista. Faltan ${C_SKILL}${turns_left}${RESET} turnos.`);
          } else {
            player.sp -= skill.sp_cost;
            skill.last_used = turn;
            await imprimir_texto(skill.effect(player, enemy));
            if (player.fled) {
              fled = true;
              player.fled = false;
            }
            break;
          }
        } else if (action === "3") {
          if (player.inventory.length === 0) {
            await imprimir_texto(`${C_ENEMIGO}No tienes ningún objeto en el inventario.${RESET}`);
            continue;
          }
          const grouped = summarize_inventory(player.inventory);
          await imprimir_texto("0. Volver");
          const itemOpts = [{ key: "0", label: "Volver", value: "0" }];
          for (let i = 0; i < grouped.length; i++) {
            const [name, count] = grouped[i];
            await imprimir_texto(`${C_ITEM}${i + 1}. ${name} x${count}${RESET}`);
            itemOpts.push({ key: String(i + 1), label: `${name} x${count}`, value: String(i + 1) });
          }

          const iChoice = parseInt(await askOptions(itemOpts), 10) - 1;
          if (iChoice === -1) continue;

          const item = get_item_by_display_index(player.inventory, iChoice + 1);
          if (!item) continue;
          await imprimir_texto(item.use(player));
          const idx = player.inventory.indexOf(item);
          if (idx !== -1) player.inventory.splice(idx, 1);
          break;
        } else if (action === "4") {
          if (enemy.is_boss) {
            await imprimir_texto(`${C_ENEMIGO}¡No puedes huir de esta batalla! ${enemy.name} te bloquea la salida.${RESET}`);
            break;
          }
          if (choice([true, false])) {
            await imprimir_texto(`${C_HEROE}${player.name}${RESET} huye del combate.`);
            fled = true;
            break;
          } else {
            await imprimir_texto(`${C_HEROE}${player.name}${RESET} no puede huir.${RESET}`);
            break;
          }
        }
      }
    }

    if (fled) break;

    if (enemy.is_alive()) {
      if (enemy.lose_turn) {
        await imprimir_texto(`${C_ENEMIGO}${enemy.name}${RESET} no puede actuar.`);
        enemy.lose_turn = false;
      } else {
        const hp_percent = enemy.hp / enemy.hp_max;
        const available_skills = enemy.skills.filter(sk => {
          if (sk.used_once && sk.skill_triggered) return false;
          if (hp_percent > sk.hp_threshold) return false;
          if (enemy.sp < sk.sp_cost) return false;
          if (turn - sk.last_used < sk.cooldown) return false;
          if (sk.requires_buff && !enemy.active_buffs.has(sk.requires_buff)) return false;
          return true;
        });

        if (available_skills.length > 0) {
          const skill = available_skills.reduce((a, b) => (b.priority > a.priority ? b : a));
          enemy.sp -= skill.sp_cost;
          skill.last_used = turn;
          if (skill.used_once) skill.skill_triggered = true;
          player.pending_messages = [];
          await imprimir_texto(skill.effect(enemy, player));
          await flushPendingMessages(player);
        } else {
          const damage = Math.max(0, enemy.attack - player.defense);
          player.pending_messages = [];
          player.take_damage(damage);
          await imprimir_texto(`${C_ENEMIGO}${enemy.name}${RESET} ataca a ${C_HEROE}${player.name}${RESET} y causa ${C_ENEMIGO}${damage}${RESET} de daño.`);
          await flushPendingMessages(player);
        }
      }
    }

    if (!player.is_alive()) {
      for (const artifact of player.artifacts) {
        if (artifact.trigger_mode === "on_death") {
          const message = artifact.apply_passive(player, enemy);
          if (message) await imprimir_texto(message);
        }
      }
    }
  }

  player.attack = original_attack;
  player.defense = original_defense;
  player.hp_max = original_hp_max;
  player.hp = Math.min(player.hp, player.hp_max);
  player.sp_max = original_sp_max;
  player.sp = Math.min(player.sp, player.sp_max);

  for (const skill of player.skills) {
    skill.last_used = -skill.cooldown;
  }

  if (!player.is_alive()) {
    await imprimir_texto(`${C_BOSS}${player.name}${RESET} ha sido derrotado.`);
  } else if (!enemy.is_alive()) {
    const gold_gain = Math.trunc(enemy.gold * (player.gold_multiplier || 1));
    player.gold += gold_gain;
    await imprimir_texto(`${C_HEROE}${player.name}${RESET} obtiene ${C_ITEM}${gold_gain}${RESET} de oro.`);

    let got_loot = false;
    if (enemy.loot_artifacts && enemy.loot_artifacts.length > 0 && Math.random() < enemy.loot_artifact_chance) {
      const ownedNames = new Set(player.artifacts.map(a => a.name));
      const possible = enemy.loot_artifacts.filter(A => {
        const inst = typeof A === "function" ? new A() : A;
        return !ownedNames.has(inst.name);
      });
      if (possible.length > 0) {
        const chosen = choice(possible);
        const artifact = typeof chosen === "function" ? new chosen() : chosen;
        await imprimir_texto(player.add_artifact(artifact));
        got_loot = true;
      }
    }

    if (!got_loot && enemy.loot_items && enemy.loot_items.length > 0 && Math.random() < enemy.loot_item_chance) {
      const chosen = choice(enemy.loot_items);
      const item = typeof chosen === "function" ? new chosen() : chosen;
      await imprimir_texto(player.add_item(item));
    }

    const exp_gain = Math.trunc(enemy.experience * (player.experience_multiplier || 1));
    player.experience += exp_gain;
    await imprimir_texto(`${C_HEROE}${player.name}${RESET} ha derrotado a ${C_ENEMIGO}${enemy.name}${RESET} y gana ${C_ITEM}${exp_gain}${RESET} de experiencia.`);
    const lvlMessages = player.check_level_up();
    if (lvlMessages) {
      for (const m of lvlMessages) {
        await imprimir_texto(m);
      }
    }
  }
  updateHUD();
}

class DungeonNode {
  constructor(event_type, node_id) {
    this.event_type = event_type;
    this.node_id = node_id;
    this.children = [];
  }
  add_child(node) {
    this.children.push(node);
  }
}

}

function find_node(root, node_id) {
  if (root.node_id === node_id) return root;
  for (const child of root.children) {
    const found = find_node(child, node_id);
    if (found) return found;
  }
  return null;
}

function spawn_random_enemy(chapter) {
  let todos, pesos;
  if (chapter === 1) {
    todos = [...ENEMIES_GENERIC, ...ENEMIES_CHAPTER_1];
    pesos = [15, 2.5, 2.5, 20, 20, 20, 20];
  } else if (chapter === 2) {
    todos = [...ENEMIES_GENERIC, ...ENEMIES_CHAPTER_2];
    pesos = [2.5, 15, 2.5, 20, 20, 20, 20];
  } else {
    todos = [...ENEMIES_GENERIC, ...ENEMIES_CHAPTER_3];
    pesos = [2.5, 2.5, 15, 20, 20, 20, 20];
  }
  const d = weightedChoice(todos, pesos);
  return new Enemy(
    d.name, d.hp, d.hp_max, d.sp, d.sp_max, d.attack, d.defense,
    d.level, d.experience, d.gold || 0, d.loot_item_chance || 0,
    d.loot_items || [], d.loot_artifact_chance || 0, d.loot_artifacts || [], d.is_boss || false
  );
}

function build_shop_entries(player) {
  const item_classes = get_all_items();
  const artifact_classes = get_all_artifacts();
  const shop_items = sample(item_classes, 3).map(Cls => new Cls());
  const ownedNames = new Set(player.artifacts.map(a => a.name));
  const available_artifacts = artifact_classes.filter(Cls => !ownedNames.has(new Cls().name));
  const shop_artifacts = sample(available_artifacts, 3).map(Cls => new Cls());
  return [
    ...shop_items.map(it => ["item", it]),
    ...shop_artifacts.map(art => ["artifact", art])
  ];
}

async function open_shop(player) {
  printDivider();
  await imprimir_texto(`¡Bienvenido a la tienda de ${C_BOSS}Valeria${RESET}!`);
  await imprimir_texto(`Tu oro actual: ${C_ITEM}${player.gold}${RESET}`);
  printDivider();

  const shop_entries = build_shop_entries(player);

  while (true) {
    if (shop_entries.length === 0) {
      await imprimir_texto("No hay artículos disponibles en la tienda en este momento.");
      return;
    }

    await imprimir_texto("ARTÍCULOS DISPONIBLES:");
    const opts = [{ key: "0", label: "Salir de la tienda", value: "0" }];
    for (let i = 0; i < shop_entries.length; i++) {
      const [kind, obj] = shop_entries[i];
      await imprimir_texto(`  ${C_ARTIFACT}${i + 1}. ${obj.name}${RESET} - ${C_ITEM}${obj.price} oro${RESET} (${kind})`);
      opts.push({
        key: String(i + 1),
        label: `${obj.name} - ${obj.price} oro (${kind})`,
        value: String(i + 1)
      });
    }
    await imprimir_texto("\n  0. Salir de la tienda");
    printDivider();

    const choiceNum = parseInt(await askOptions(opts), 10);
    if (choiceNum === 0) {
      await imprimir_texto(`\n${C_HEROE}${player.name}${RESET} se va de la tienda.`);
      break;
    }

    const index = choiceNum - 1;
    if (index >= 0 && index < shop_entries.length) {
      const [kind, obj] = shop_entries[index];
      const price = obj.price || 0;
      if (player.gold >= price) {
        if (kind === "item") {
          player.gold -= price;
          const ItemCls = obj.constructor;
          player.add_item(new ItemCls());
          await imprimir_texto(`\n${C_HEROE}${player.name}${RESET} compra ${C_ITEM}${obj.name}${RESET} por ${C_ITEM}${price} oro${RESET}. Oro restante: ${C_ITEM}${player.gold}${RESET}\n`);
        } else {
          player.gold -= price;
          const added_message = player.add_artifact(obj);
          await imprimir_texto(added_message);
          await imprimir_texto(`\n${C_HEROE}${player.name}${RESET} compra ${C_ARTIFACT}${obj.name}${RESET} por ${C_ITEM}${price} oro${RESET}. Oro restante: ${C_ITEM}${player.gold}${RESET}\n`);
          shop_entries.splice(index, 1);
        }
      } else {
        await imprimir_texto(`\n✗ No tienes suficiente oro. Necesitas ${C_ITEM}${price}${RESET} y tienes ${C_ITEM}${player.gold}${RESET}\n`);
      }
    }
    updateHUD();
  }
}

async function run_node(player, node, chapter) {
  if (node.event_type === "Enemigo") {
    const enemy = spawn_random_enemy(chapter);
    await combat(player, enemy);
  } else if (node.event_type === "Cofre") {
    const ownedNames = new Set(player.artifacts.map(a => a.name));
    const available = get_all_artifacts().filter(Cls => !ownedNames.has(new Cls().name));
    if (available.length === 0) {
      await imprimir_texto(`${C_HEROE}${player.name}${RESET} encuentra un cofre vacío (ya posees todos los artefactos disponibles).`);
    } else {
      const ACls = choice(available);
      await imprimir_texto(player.add_artifact(new ACls()));
    }
  } else if (node.event_type === "Evento") {
    if (Math.random() < 0.80) {
      const ev = choice(["Tienda", "Item", "Artefacto"]);
      if (ev === "Tienda") {
        await open_shop(player);
      } else if (ev === "Item") {
        const ICls = choice([EstrellaLevante, Guldendraak, Fricandela, Mexicano, MenuRolloMixto, MenuFritaten]);
        const item = new ICls();
        player.add_item(item);
        await imprimir_texto(`${C_HEROE}${player.name}${RESET} ha encontrado un bar abandonado y descubre ${C_ITEM}${item.name}${RESET} en una mochila de Glovo tirada.`);
      } else {
        const ownedNames = new Set(player.artifacts.map(a => a.name));
        const available = get_all_artifacts().filter(Cls => !ownedNames.has(new Cls().name));
        if (available.length === 0) {
          await imprimir_texto(`${C_HEROE}${player.name}${RESET} encuentras al legendario Siko que sonriendo te ofrece un artefacto, pero ya posees todos los que ofrece.`);
        } else {
          const ACls = choice(available);
          const artifact = new ACls();
          await imprimir_texto(`${C_HEROE}${player.name}${RESET} encuentras al legendario Siko que sonriendo te ofrece: ${C_ARTIFACT}${artifact.name}${RESET}`);
          await imprimir_texto(player.add_artifact(artifact));
        }
      }
    } else {
      const ev = choice(["Trampa", "Enemigo"]);
      if (ev === "Trampa") {
        const damage = randint(10, 30);
        player.pending_messages = [];
        player.take_damage(damage);
        await imprimir_texto(`${C_HEROE}${player.name}${RESET} ha caído en una trampa y recibe ${C_ENEMIGO}${damage}${RESET} de daño.`);
        await flushPendingMessages(player);
      } else {
        const enemy = spawn_random_enemy(chapter);
        await combat(player, enemy);
      }
    }
  } else if (node.event_type === "Jefe") {
    let boss;
    if (chapter === 1) boss = new Boss_1();
    else if (chapter === 2) boss = new Boss_2();
    else boss = new FinalBoss();
    if (boss.introduction) await imprimir_texto(boss.introduction);
    await combat(player, boss);
  } else if (node.event_type === "Descanso") {
    player.heal(player.hp_max);
    player.sp = player.sp_max;
    await imprimir_texto(`${C_HEROE}${player.name}${RESET} se recuesta en un campamento abandonado y recupera todos sus hp y sp`);
  }
  updateHUD();
}

/* =========================================================
   8. GUARDADO EN NAVEGADOR (storage.py -> localStorage)
   ========================================================= */
const SAVE_KEY = "slay_the_kebab_save_v1";

const CHAR_CLASSES = {
  Matabufalez, Yuri, Freakmaster, Sami, Ana
};

const ITEM_BY_NAME = {};
get_all_items().forEach(Cls => { ITEM_BY_NAME[new Cls().name] = Cls; });

const ARTIFACT_BY_NAME = {};
get_all_artifacts().forEach(Cls => { ARTIFACT_BY_NAME[new Cls().name] = Cls; });

const SKILL_BY_NAME = {};
[...SKILLS_PLAYER, HallDeLaFama, CorteBienFiludo, MadreDeGatos, EraTanFacil, PorlaPaz, Meteoro, JuicioFinal, Thor, Boreal, MeVoyAFumar].forEach(Cls => {
  SKILL_BY_NAME[new Cls().name] = Cls;
});

function save_player(player) {
  const data = {
    name: player.name,
    char_class: player.char_class,
    hp: player.hp,
    hp_max: player.hp_max,
    sp: player.sp,
    sp_max: player.sp_max,
    attack: player.attack,
    defense: player.defense,
    level: player.level,
    experience: player.experience,
    gold: player.gold,
    chapter: player.chapter,
    current_node_id: player.current_node_id,
    experience_multiplier: player.experience_multiplier,
    gold_multiplier: player.gold_multiplier,
    inventory: player.inventory.map(i => i.name),
    artifacts: player.artifacts.map(a => ({ name: a.name, used: !!a.used, revives_on_death: !!a.revives_on_death })),
    skills: player.skills.map(s => ({ name: s.name, level_required: s.level_required }))
  };
  localStorage.setItem(SAVE_KEY, JSON.stringify(data));
}

function has_saved_players() {
  return localStorage.getItem(SAVE_KEY) !== null;
}

function load_player() {
  const raw = localStorage.getItem(SAVE_KEY);
  if (!raw) return null;
  try {
    const data = JSON.parse(raw);
    const Cls = CHAR_CLASSES[data.char_class] || Matabufalez;
    const player = new Cls();
    player.hp = data.hp;
    player.hp_max = data.hp_max;
    player.sp = data.sp;
    player.sp_max = data.sp_max;
    player.attack = data.attack;
    player.defense = data.defense;
    player.level = data.level;
    player.experience = data.experience;
    player.gold = data.gold ?? 0;
    player.chapter = data.chapter;
    player.current_node_id = data.current_node_id;
    player.experience_multiplier = data.experience_multiplier || 1;
    player.gold_multiplier = data.gold_multiplier || 1;

    player.inventory = (data.inventory || []).map(n => ITEM_BY_NAME[n] ? new ITEM_BY_NAME[n]() : null).filter(Boolean);
    player.artifacts = (data.artifacts || []).map(aObj => {
      const ACls = ARTIFACT_BY_NAME[aObj.name];
      if (!ACls) return null;
      const inst = new ACls();
      if (aObj.used !== undefined) inst.used = aObj.used;
      if (aObj.revives_on_death !== undefined) inst.revives_on_death = aObj.revives_on_death;
      return inst;
    }).filter(Boolean);

    if (data.skills && data.skills.length > 0) {
      player.skills = data.skills.map(sObj => {
        const SCls = SKILL_BY_NAME[sObj.name];
        if (!SCls) return null;
        const sk = new SCls();
        sk.level_required = sObj.level_required;
        return sk;
      }).filter(Boolean);
    }
    return player;
  } catch (e) {
    console.error("Error cargando partida:", e);
    return null;
  }
}

function delete_saved_game() {
  localStorage.removeItem(SAVE_KEY);
}

/* =========================================================
   9. FLUJO PRINCIPAL DEL JUEGO (main.py)
   ========================================================= */
let activePlayer = null;

function updateHUD() {
  const hud = document.getElementById("hud");
  if (!activePlayer) {
    hud.style.display = "none";
    return;
  }
  hud.style.display = "grid";
  document.getElementById("hud-name").textContent = activePlayer.name;
  document.getElementById("hud-lvl").textContent = activePlayer.level;
  document.getElementById("hud-chap").textContent = activePlayer.chapter;
  document.getElementById("hud-node").textContent = activePlayer.current_node_id;
  document.getElementById("hud-hp").textContent = `${activePlayer.hp}/${activePlayer.hp_max}`;
  document.getElementById("hud-sp").textContent = `${activePlayer.sp}/${activePlayer.sp_max}`;
  document.getElementById("hud-atk").textContent = activePlayer.attack;
  document.getElementById("hud-def").textContent = activePlayer.defense;
  document.getElementById("hud-exp").textContent = `${activePlayer.experience}/${activePlayer.level * 100}`;
  document.getElementById("hud-gold").textContent = activePlayer.gold;

  const hpPct = Math.max(0, Math.min(100, (activePlayer.hp / activePlayer.hp_max) * 100));
  const spPct = Math.max(0, Math.min(100, (activePlayer.sp / activePlayer.sp_max) * 100));
  document.getElementById("bar-hp").style.width = `${hpPct}%`;
  document.getElementById("bar-sp").style.width = `${spPct}%`;
}

async function intro_screen() {
  mostrar_titulo_gigante("Slay the Kebab", C_SKILL);
  await imprimir_texto("En un mundo donde la bondad ha desaparecido y el mayor ejemplo de virtud se volvio un tirano...", 0.04);
  await imprimir_texto("Te levantas resignado, pues ya no aguantas mas la represion.", 0.04);
  await imprimir_texto("Justo cuando esa idea asoma en tu cabeza una luz resplandeciente ilumina tu habitacion, en ella aparece una diosa", 0.04);
  await imprimir_texto(`${C_BOSS}Ana, reencarnacion de Freya:${RESET} Solo tu, amigo de ${C_BOSS}Pepeda, el Sultan${RESET}, puedes acabar con esta pesadilla.`, 0.04);
}

async function select_player() {
  await intro_screen();
  await imprimir_texto(`${C_BOSS}Ana, Reencarnacion de Freya${RESET}: ¿Quien eres tu?`);
  await imprimir_texto(`${C_HEROE}1. Matabufalez, El Papucheitor${RESET}`);
  await imprimir_texto(`${C_HEROE}2. Freakmaster, El Tecnodruida${RESET}`);
  await imprimir_texto(`${C_HEROE}3. JayC, The Chillman${RESET}`);
  await imprimir_texto(`${C_HEROE}4. Sami, El HardcoreGuy${RESET}`);

  while (true) {
    const ch = await askOptions([
      { key: "1", label: "Matabufalez, El Papucheitor", value: "1" },
      { key: "2", label: "Freakmaster, El Tecnodruida", value: "2" },
      { key: "3", label: "JayC, The Chillman", value: "3" },
      { key: "4", label: "Sami, El HardcoreGuy", value: "4" }
    ], true);

    if (ch === "1") return new Matabufalez();
    if (ch === "2") return new Freakmaster();
    if (ch === "3") return new Yuri();
    if (ch === "4") return new Sami();
    if (ch === "210522") return new Ana();
    await imprimir_texto(`${C_ENEMIGO}Opción no válida.${RESET}`);
  }
}

async function show_epilogue(player) {
  printDivider();
  mostrar_titulo_gigante("EPILOGO", C_BOSS);
  printDivider();
  await imprimir_texto(player.get_epilogue());
}

async function show_credits() {
  printDivider();
  mostrar_titulo_gigante("Slay The Kebab", C_ARTIFACT);
  printDivider();
  await imprimir_texto("Un juego creado con cariño y aprecio, espero que lo hayais disfrutado");
  await imprimir_texto("\n¡Gracias por jugar!");
}

async function main() {
  while (true) {
    activePlayer = null;
    updateHUD();
    mostrar_titulo_gigante("PAPADAS GAMES", C_BOSS);
    await imprimir_texto(`${C_BOSS}Presenta${RESET}`);

    let player;
    if (has_saved_players()) {
      await imprimir_texto("¿Quieres continuar una partida existente?\n1. Nueva partida\n2. Continuar partida");
      const ch = await askOptions([
        { key: "1", label: "Nueva partida", value: "1" },
        { key: "2", label: "Continuar partida", value: "2" }
      ]);
      if (ch === "2") {
        player = load_player();
        if (player) {
          await imprimir_texto(`¡Bienvenido de nuevo, ${C_HEROE}${player.name}${RESET}! Continuemos tu aventura.`);
        } else {
          player = await select_player();
          await imprimir_texto(`¡Bienvenido, ${C_HEROE}${player.name}${RESET}! Tu aventura comienza ahora.`);
        }
      } else {
        delete_saved_game();
        player = await select_player();
        await imprimir_texto(`¡Bienvenido, ${C_HEROE}${player.name}${RESET}! Tu aventura comienza ahora.`);
      }
    } else {
      player = await select_player();
      await imprimir_texto(`¡Bienvenido, ${C_HEROE}${player.name}${RESET}! Tu aventura comienza ahora.`);
    }

    activePlayer = player;
    updateHUD();

    let dungeon_root = build_dungeon();
    let current_node = find_node(dungeon_root, player.current_node_id) || dungeon_root;

    while (player.is_alive()) {
      await imprimir_texto("\n¿Qué quieres hacer?:");
      await imprimir_texto("1. Avanzar");
      await imprimir_texto("2. Ver estado");
      await imprimir_texto("3. Guardar partida");

      const action = await askOptions([
        { key: "1", label: "Avanzar", value: "1" },
        { key: "2", label: "Ver estado", value: "2" },
        { key: "3", label: "Guardar partida", value: "3" }
      ]);

      if (action === "1") {
        if (current_node.children.length > 0) {
          await imprimir_texto("\n¿Hacia dónde quieres ir?");
          const pathOpts = [];
          for (let i = 0; i < current_node.children.length; i++) {
            const child = current_node.children[i];
            await imprimir_texto(`${i + 1}. ${child.event_type}`);
            pathOpts.push({
              key: String(i + 1),
              label: `Camino ${i + 1}: ${child.event_type}`,
              value: String(i)
            });
          }
          const idx = parseInt(await askOptions(pathOpts), 10);
          current_node = current_node.children[idx];
          player.current_node_id = current_node.node_id;
          updateHUD();
          await run_node(player, current_node, player.chapter);
        } else {
          if (player.is_alive()) {
            if (player.chapter === 3) {
              await show_epilogue(player);
              await show_credits();
              break;
            } else {
              player.chapter += 1;
              await imprimir_texto(`\n${C_SKILL}¡Capítulo ${C_BOSS}${player.chapter - 1}${C_SKILL} completado! Comienza el Capítulo ${C_BOSS}${player.chapter}${C_SKILL}.${RESET}`);
              dungeon_root = build_dungeon();
              current_node = find_node(dungeon_root, "n0");
              player.current_node_id = "n0";
              updateHUD();
            }
          } else {
            await imprimir_texto(`${C_SISTEMA}Has sido derrotado.${RESET}`);
          }
        }
      } else if (action === "2") {
        while (true) {
          await imprimir_texto("\nVer estado:");
          await imprimir_texto("0. Volver");
          await imprimir_texto("1. Estadisticas");
          await imprimir_texto("2. Inventario");

          const sub = await askOptions([
            { key: "1", label: "Estadísticas", value: "1" },
            { key: "2", label: "Inventario", value: "2" },
            { key: "0", label: "Volver", value: "0" }
          ]);

          if (sub === "0") break;
          if (sub === "1") {
            await imprimir_texto(player.get_stats());
          } else if (sub === "2") {
            while (true) {
              await imprimir_texto("\nInventario:");
              await imprimir_texto("0. Volver");
              await imprimir_texto("1. Objetos");
              await imprimir_texto("2. Artefactos");

              const inv_sub = await askOptions([
                { key: "1", label: "Objetos", value: "1" },
                { key: "2", label: "Artefactos", value: "2" },
                { key: "0", label: "Volver", value: "0" }
              ]);

              if (inv_sub === "0") break;
              if (inv_sub === "1") {
                if (player.inventory.length === 0) {
                  await imprimir_texto("No tienes objetos.");
                  continue;
                }
                while (true) {
                  const grouped_items = summarize_inventory(player.inventory);
                  await imprimir_texto("\nTus objetos:");
                  const opts = [{ key: "0", label: "Volver", value: "0" }];
                  for (let i = 0; i < grouped_items.length; i++) {
                    const [name, count] = grouped_items[i];
                    await imprimir_texto(`${i + 1}. ${C_ITEM}${name}${RESET} x${count}`);
                    opts.push({ key: String(i + 1), label: `${name} x${count}`, value: String(i + 1) });
                  }
                  await imprimir_texto("0. Volver");
                  const c = parseInt(await askOptions(opts), 10);
                  if (c === 0) break;
                  const item = get_item_by_display_index(player.inventory, c);
                  if (item) {
                    await imprimir_texto(`\n${C_ITEM}${item.name}${RESET}: ${item.description}\n`);
                    await askOptions([{ key: "Enter", label: "Volver a la lista de objetos", value: "ok" }]);
                  }
                }
              } else if (inv_sub === "2") {
                if (player.artifacts.length === 0) {
                  await imprimir_texto("No tienes artefactos.");
                  continue;
                }
                while (true) {
                  const grouped_artifacts = summarize_inventory(player.artifacts);
                  await imprimir_texto("\nTus artefactos:");
                  const opts = [{ key: "0", label: "Volver", value: "0" }];
                  for (let i = 0; i < grouped_artifacts.length; i++) {
                    const [name, count] = grouped_artifacts[i];
                    await imprimir_texto(`${i + 1}. ${C_ARTIFACT}${name}${RESET} x${count}`);
                    opts.push({ key: String(i + 1), label: `${name} x${count}`, value: String(i + 1) });
                  }
                  await imprimir_texto("0. Volver");
                  const c = parseInt(await askOptions(opts), 10);
                  if (c === 0) break;
                  const art = get_item_by_display_index(player.artifacts, c);
                  if (art) {
                    await imprimir_texto(`\n${C_ARTIFACT}${art.name}${RESET}: ${art.description}\n`);
                    await askOptions([{ key: "Enter", label: "Volver a la lista de artefactos", value: "ok" }]);
                  }
                }
              }
            }
          }
        }
      } else if (action === "3") {
        save_player(player);
        await imprimir_texto(`${C_SKILL}¡Partida guardada correctamente en el navegador!${RESET}`);
      }
    }

    if (player.is_alive()) {
      await imprimir_texto("\n¡Felicidades por completar tu aventura!");
    } else {
      await imprimir_texto("Game Over. Gracias por jugar.");
    }

    await imprimir_texto("¿Quieres jugar de nuevo? (s/n)");
    const restart = await askOptions([
      { key: "s", label: "Sí, jugar de nuevo", value: "s" },
      { key: "n", label: "No, salir", value: "n" }
    ]);
    if (restart !== "s") {
      await imprimir_texto("¡Hasta la próxima, aventurero!");
      break;
    }
    clearTerminal();
  }
}

window.onload = () => {
  main();
};
</script>
